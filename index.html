<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Support Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .demo-container {
            text-align: center;
            color: white;
            margin-bottom: 100px;
        }

        .demo-container h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .demo-container p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        /* Chatbot Widget Styles */
        #chatbot-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s;
            z-index: 1000;
        }

        #chatbot-toggle:hover {
            transform: scale(1.1);
        }

        #chatbot-toggle svg {
            width: 30px;
            height: 30px;
            fill: white;
        }

        #chatbot-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            height: 550px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #chatbot-container.active {
            display: flex;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h3 {
            font-size: 1.2em;
        }

        .chat-header small {
            opacity: 0.9;
            display: block;
            margin-top: 5px;
        }

        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            width: fit-content;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .typing-indicator.active {
            display: block;
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #667eea;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .chat-input-container {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #user-input:focus {
            border-color: #667eea;
        }

        #send-button {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        #send-button:hover {
            transform: scale(1.05);
        }

        #send-button svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .quick-replies {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .quick-reply-btn {
            padding: 8px 15px;
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .quick-reply-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 480px) {
            #chatbot-container {
                width: calc(100vw - 40px);
                height: calc(100vh - 100px);
                bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>🤖 AI Customer Support Chatbot</h1>
        <p>Click the chat button in the bottom right to start!</p>
    </div>

    <!-- Chatbot Toggle Button -->
    <button id="chatbot-toggle">
        <svg viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
        </svg>
    </button>

    <!-- Chatbot Container -->
    <div id="chatbot-container">
        <div class="chat-header">
            <div>
                <h3>Customer Support</h3>
                <small>We typically reply instantly</small>
            </div>
        </div>
        <div id="chat-messages">
            <div class="message bot">
                <div class="message-content">
                    👋 Hello! I'm your AI assistant. How can I help you today?
                </div>
            </div>
            <div class="quick-replies">
                <button class="quick-reply-btn" onclick="sendQuickReply('Product information')">📦 Products</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('Pricing')">💰 Pricing</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('Support')">🛠️ Support</button>
                <button class="quick-reply-btn" onclick="sendQuickReply('Contact')">📞 Contact</button>
            </div>
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Type your message..." />
            <button id="send-button">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const chatbotToggle = document.getElementById('chatbot-toggle');
        const chatbotContainer = document.getElementById('chatbot-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const chatMessages = document.getElementById('chat-messages');
        const typingIndicator = document.querySelector('.typing-indicator');

        // Toggle chatbot
        chatbotToggle.addEventListener('click', () => {
            chatbotContainer.classList.toggle('active');
            if (chatbotContainer.classList.contains('active')) {
                userInput.focus();
            }
        });

        // AI Response Database
        const responses = {
            'product': 'We offer a wide range of products including premium services, custom solutions, and enterprise packages. What specific product are you interested in?',
            'pricing': 'Our pricing starts at $29/month for basic plans, $99/month for professional, and custom pricing for enterprise. Would you like detailed pricing information?',
            'support': 'Our support team is available 24/7 via email at support@example.com or call us at 1-800-SUPPORT. How can we assist you?',
            'contact': 'You can reach us at:\n📧 Email: hello@example.com\n📞 Phone: 1-800-CONTACT\n🏢 Address: 123 Business St, City, Country',
            'hours': 'We are open Monday-Friday 9AM-6PM EST. Our chatbot is available 24/7!',
            'shipping': 'We offer free shipping on orders over $50. Standard shipping takes 3-5 business days, express shipping 1-2 days.',
            'return': 'We have a 30-day return policy. Items must be unused and in original packaging. Contact support@example.com to initiate a return.',
            'default': 'Thank you for your message! A human agent will respond shortly. In the meantime, you can ask me about products, pricing, support, or contact information.'
        };

        // Send message function
        function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';

            // Show typing indicator
            typingIndicator.classList.add('active');

            // Simulate AI response delay
            setTimeout(() => {
                typingIndicator.classList.remove('active');
                const response = getAIResponse(message);
                addMessage(response, 'bot');
            }, 1000 + Math.random() * 1000);
        }

        // Get AI response
        function getAIResponse(message) {
            const lowerMessage = message.toLowerCase();
            
            if (lowerMessage.includes('product') || lowerMessage.includes('what do you sell')) {
                return responses.product;
            } else if (lowerMessage.includes('price') || lowerMessage.includes('cost') || lowerMessage.includes('pricing')) {
                return responses.pricing;
            } else if (lowerMessage.includes('support') || lowerMessage.includes('help')) {
                return responses.support;
            } else if (lowerMessage.includes('contact') || lowerMessage.includes('reach')) {
                return responses.contact;
            } else if (lowerMessage.includes('hours') || lowerMessage.includes('open')) {
                return responses.hours;
            } else if (lowerMessage.includes('shipping') || lowerMessage.includes('delivery')) {
                return responses.shipping;
            } else if (lowerMessage.includes('return') || lowerMessage.includes('refund')) {
                return responses.return;
            } else if (lowerMessage.includes('hello') || lowerMessage.includes('hi')) {
                return '👋 Hello! How can I assist you today?';
            } else if (lowerMessage.includes('thank')) {
                return 'You\'re welcome! Is there anything else I can help you with?';
            } else {
                return responses.default;
            }
        }

        // Add message to chat
        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = text;
            
            messageDiv.appendChild(contentDiv);
            chatMessages.insertBefore(messageDiv, typingIndicator);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Quick reply function
        function sendQuickReply(text) {
            userInput.value = text;
            sendMessage();
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
